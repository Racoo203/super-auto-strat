[project]
name = "super-auto-strat"
version = "0.1.0"
description = "Text auto-battler engine, gymnasium env and from-scratch PPO agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    # On Linux the PyPI wheel bundles CUDA; it falls back to CPU when no GPU is visible.
    "torch>=2.5",
    # run tracking and visualisation for agents/ppo
    "optuna>=4.0",
    "optuna-dashboard>=0.17",
    "tensorboard>=2.17",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false  # sap/ and agents/ are imported from the repo root, not installed
# Pin the direct dependencies to the versions the code was developed and tested with (the laptop's
# conda env), so the server trains on exactly that stack. Bump them here deliberately, then
# `uv lock` and re-run the tests; uv.lock pins everything else.
constraint-dependencies = [
    "torch==2.10.0",
    "numpy==2.4.3",
    "gymnasium==1.3.0",
    "optuna==5.1.0",
    "optuna-dashboard==0.21.0",
    "tensorboard==2.21.0",
    "pandas==3.0.2",
    "matplotlib==3.10.9",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
